[project]
name = "spx-research"
version = "0.1.0"
description = "Point-in-time blinded AI policy simulation for SPX credit spreads (research scaffold)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "duckdb>=1.1",
    "langgraph>=0.2",
    "openai>=1.50",
    "polars>=1.8",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "streamlit>=1.38",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "jsonschema>=4.26.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
spx-research = "spx_research.cli.main:app"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
